# The chart's class, claimed by the controller.
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringClass
metadata:
  name: coroot
spec:
  controllerName: openeverest.io/monitoring-coroot
  extensionManaged:
    requires:
      connection: true
    podMetadata:
      annotationPrefixes:
        - coroot.com/
  authModes:
    - name: Anonymous
status:
  (conditions[?type == 'Accepted'] | [0].status): "True"

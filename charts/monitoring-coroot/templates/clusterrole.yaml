{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "monitoring-coroot.fullname" . }}
  labels:
    {{- include "monitoring-coroot.labels" . | nindent 4 }}
# A class controller reads the monitoring kinds and Instances and writes only
# monitoring status. It never writes Instances or pods, and never reads
# Secrets: the annotations it requests name Secrets that coroot-cluster-agent
# reads itself.
rules:
  - apiGroups: [monitoring.openeverest.io]
    resources: [monitoringclasses, monitoringdestinations, monitoringbindings]
    verbs: [get, list, watch]
  - apiGroups: [monitoring.openeverest.io]
    resources: [monitoringclasses/status, monitoringdestinations/status, monitoringbindings/status]
    verbs: [patch]
  - apiGroups: [core.openeverest.io]
    resources: [instances]
    verbs: [get, list, watch]
{{- end }}
